  return fixes
}
function generateWeek(existing){let active=state.dishes.filter(d=>d.active),recent=new Set(existing.slice(-2).flatMap(w=>Object.values(w.slots).filter(Boolean))),families=new Set(existing.slice(-1).flatMap(w=>Object.values(w.slots).map(id=>state.dishes.find(d=>d.id===id)?.family).filter(Boolean))),used=new Set(),bc=existing.reduce((n,w)=>n+Object.values(w.slots).filter(x=>x==='bolognese').length,0);function pick(fn,allow=false){let p=active.filter(d=>fn(d)&&!used.has(d.id)&&(!recent.has(d.id)||allow)&&!families.has(d.family));if(!p.length)p=active.filter(d=>fn(d)&&!used.has(d.id)&&(!recent.has(d.id)||allow));if(!p.length)p=active.filter(d=>fn(d)&&!used.has(d.id));let d=p[Math.floor(Math.random()*p.length)];if(d)used.add(d.id);return d?.id||null}let mo=pick(d=>['fisch','fleisch','auflauf','wrap','risotto'].includes(d.family)),di=pick(d=>d.protein==='huhn'&&d.family!=='suppe'),mi=pick(d=>['suppe','eintopf','knoedel','risotto'].includes(d.family)),fr;if(bc<2&&active.some(d=>d.id==='bolognese'))fr='bolognese';else fr=pick(d=>['pasta','reis','curry','pizza','wrap','mehlspeise'].includes(d.family),true);return{mo,di,mi,do:null,fr}}
function localDateISO(){let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function syncRollingPlan(){if(!Array.isArray(state.plan)||!state.plan.length)return 0;let rolled=0,today=localDateISO();while(state.plan.length>1&&today>=state.plan[1].start){let dropped=state.plan.shift();state.history=[...(state.history||[]),dropped].slice(-12);let last=state.plan.at(-1);state.plan.push({start:addDays(last.start,7),slots:generateWeek(state.plan),portions:{mo:3,di:4,mi:4,fr:4}});rolled++}if(rolled){state.checked={};shoppingWeek=0;save()}return rolled}
function openEditor(id){let d=clone(state.dishes.find(x=>x.id===id));editing=d;let m=document.getElementById('modal');m.classList.remove('hidden');m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Gericht bearbeiten</h2><button class="iconBtn" data-act="closeModal">×</button></div><div class="formGrid"><label class="span2">Name<input id="eName" value="${esc(d.name)}"></label><label>Quelle<input id="eSource" value="${esc(d.source)}"></label><label>Standardportionen<input id="ePortions" type="number" min="1" value="${d.standardPortions}"></label><label class="span2">Rezept-Link<input id="eUrl" value="${esc(d.url||'')}"></label><label class="span2">Notiz<textarea id="eNotes">${esc(d.notes||'')}</textarea></label></div><div class="ingredientHead"><div><h3>Zutaten</h3><p>Mengen gelten für die Standardportionen.</p></div><button class="ghost" data-act="addIng">+ Zutat</button></div><div class="ingredientTable"><div class="ingHeader"><span>Zutat</span><span>Menge</span><span>Einheit</span><span>Kategorie</span><span></span></div><div id="ingRows">${ingRows(d)}</div></div><div class="modalActions"><button class="ghost" data-act="closeModal">Abbrechen</button><button class="primary" data-act="saveDish">Speichern</button></div></div>`}
function ingRows(d){return d.ingredients.map((i,x)=>`<div class="ingRow"><input data-ing="${x}|name" value="${esc(i.name)}" placeholder="z. B. Rinderfaschiertes"><input data-ing="${x}|qty" type="number" min="0" step="0.01" value="${esc(i.qty)}"><input data-ing="${x}|unit" value="${esc(i.unit||'g')}"><select data-ing="${x}|category">${CATS.map(c=>`<option ${c===(i.category||'Sonstiges')?'selected':''}>${c}</option>`).join('')}</select><button class="iconBtn" data-remove-ing="${x}">×</button></div>`).join('')}
function closeModal(){document.getElementById('modal').classList.add('hidden');editing=null}
document.addEventListener('click',e=>{let t=e.target;if(t.dataset.tab){tab=t.dataset.tab;render();return}let a=t.dataset.act;if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='wochenplan-backup.json';x.click();URL.revokeObjectURL(u)}if(a==='import')document.getElementById('importFile').click();if(a==='addManualShopping'){let el=document.getElementById('manualShoppingInput'),name=el?.value.trim(),w=state.plan[shoppingWeek];if(name&&w){state.manualShopping=state.manualShopping||{};state.manualShopping[w.start]=state.manualShopping[w.start]||[];state.manualShopping[w.start].push({id:uid(),name});save();render();flash('Zur Einkaufsliste hinzugefügt.')}}if(t.dataset.removeManual!==undefined){let start=t.dataset.manualWeek,id=t.dataset.removeManual;if(state.manualShopping?.[start]){state.manualShopping[start]=state.manualShopping[start].filter(x=>x.id!==id);if(!state.manualShopping[start].length)delete state.manualShopping[start];save();render();}}if(a==='reset'&&confirm('App wirklich auf die Ausgangsdaten zurücksetzen?')){state=init();syncRollingPlan();save();render()}if(a==='addDish'){let d={id:'custom-'+uid(),name:'Neues Gericht',source:'Eigenes Gericht',family:'sonstiges',protein:'',season:'ganzjährig',standardPortions:4,url:'',notes:'',active:true,ingredients:[]};state.dishes.push(d);save();render();openEditor(d.id)}if(t.dataset.edit)openEditor(t.dataset.edit);if(a==='closeModal')closeModal();if(a==='addIng'){editing.ingredients.push({id:uid(),name:'',qty:'',unit:'g',category:'Sonstiges'});document.getElementById('ingRows').innerHTML=ingRows(editing)}if(t.dataset.removeIng!==undefined){editing.ingredients.splice(Number(t.dataset.removeIng),1);document.getElementById('ingRows').innerHTML=ingRows(editing)}if(a==='saveDish'){editing.name=document.getElementById('eName').value.trim();editing.source=document.getElementById('eSource').value;editing.standardPortions=Math.max(1,Number(document.getElementById('ePortions').value)||4);editing.url=document.getElementById('eUrl').value;editing.notes=document.getElementById('eNotes').value;editing.ingredients=editing.ingredients.filter(i=>i.name.trim()).map(i=>({...i,qty:Number(i.qty)||0}));let idx=state.dishes.findIndex(d=>d.id===editing.id);state.dishes[idx]=editing;editing.ingredients.forEach(i=>{let k=norm(i.name);state.catalog[k]={...(defaultPack(i.name,i.unit)),...(state.catalog[k]||{}),name:i.name,category:i.category}});save();closeModal();render();flash('Gericht gespeichert.')}if(a==='addCatalog'){let el=document.getElementById('newCatalog'),name=el.value.trim(),k=norm(name);if(k){state.catalog[k]={...(state.catalog[k]||{}),name,category:state.catalog[k]?.category||'Sonstiges',packSize:state.catalog[k]?.packSize||'',packUnit:state.catalog[k]?.packUnit||'g'};save();render()}}});

document.addEventListener('click',async e=>{
  const t=e.target,a=t.dataset.act,auth=t.dataset.auth;
  if(a==='account'){openAccount();return}
  if(!auth)return;
  if(auth==='login'||auth==='signup'){
    const email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPassword')?.value||'';
    if(!email||password.length<6){alert('Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.');return}
    if(auth==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password});if(error){alert(error.message);return}closeModal();flash('Angemeldet.')
    }else{
      const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:APP_URL}});if(error){alert(error.message);return}
      if(data.session){closeModal();flash('Registrierung abgeschlossen.')}else flash('Bitte bestätige die Registrierung über die E-Mail von Supabase.')
    }
  }
  if(auth==='logout'){await sb.auth.signOut();closeModal();flash('Abgemeldet. Die lokalen Daten bleiben auf diesem Gerät erhalten.')}
  if(auth==='createHousehold'){
    const name=document.getElementById('householdName')?.value.trim()||'Unser Haushalt';
    const {data,error}=await sb.rpc('create_household',{p_name:name,p_state:state});if(error){alert(error.message);return}
    await loadHousehold();openAccount();flash('Gemeinsamer Haushalt erstellt.')
  }
  if(auth==='joinHousehold'){
    const code=(document.getElementById('joinCode')?.value||'').trim().toUpperCase();if(!code){alert('Bitte Einladungscode eingeben.');return}
    const {data,error}=await sb.rpc('join_household',{p_code:code});if(error){alert(error.message);return}
    await loadHousehold();openAccount();flash('Haushalt verbunden.')
  }
  if(auth==='refreshCloud'){await loadHousehold();openAccount();flash('Synchronisiert.')}
});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.ing){let[i,k]=t.dataset.ing.split('|');editing.ingredients[Number(i)][k]=t.value}if(t.id==='dishSearch')document.getElementById('dishGrid').innerHTML=dishCards(t.value);if(t.dataset.pack){let[k,f]=t.dataset.pack.split('|');state.catalog[k]={...(state.catalog[k]||{}),[f==='size'?'packSize':'packUnit']:t.value};save()}if(t.dataset.pantry){let[k,f]=t.dataset.pantry.split('|');state.pantry[k]={...(state.pantry[k]||{}),[f]:t.value};save()}if(t.id==='discount'){state.settings.intersparDiscount=t.value;save()}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.slot){let[i,d]=t.dataset.slot.split('|'),wi=Number(i),next=t.value||null,w=state.plan[wi],prev=w.slots[d];if(isSoupId(next)&&['mo','di','mi','fr'].some(day=>day!==d&&isSoupId(w.slots[day]))){t.value=prev||'';flash('Planregel: maximal 1 Suppe pro Woche.');return}w.slots[d]=next;save();render()}if(t.dataset.portions){let[i,d]=t.dataset.portions.split('|');state.plan[Number(i)].portions[d]=Math.max(1,Number(t.value)||1);save()}if(t.id==='shoppingWeek'){shoppingWeek=Number(t.value);render()}if(t.id==='usePackages'){state.settings.usePackages=t.checked;save();render()}if(t.id==='usePantry'){state.settings.usePantry=t.checked;save();render()}if(t.dataset.check){state.checked[t.dataset.check]=t.checked;save();render()}if(t.dataset.active){state.dishes.find(d=>d.id===t.dataset.active).active=t.checked;save();render()}if(t.dataset.cat){state.catalog[t.dataset.cat]={...(state.catalog[t.dataset.cat]||{}),category:t.value};save()}if(t.dataset.ing){let[i,k]=t.dataset.ing.split('|');editing.ingredients[Number(i)][k]=t.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='manualShoppingInput'){e.preventDefault();document.querySelector('[data-act="addManualShopping"]')?.click()}});
document.getElementById('importFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=reconcilePool(JSON.parse(r.result));syncRollingPlan();save();render();flash('Backup importiert.')}catch(err){alert('Ungültige JSON-Datei.')}};r.readAsText(f);e.target.value=''});
let autoRolled=syncRollingPlan();let soupFixed=enforceMaxOneSoupPerWeek();save();render();initCloud();if(autoRolled)flash(`${autoRolled} abgelaufene Woche${autoRolled===1?'':'n'} weitergerollt.`);else if(soupFixed)flash(`${soupFixed} zusätzliche Suppe${soupFixed===1?'':'n'} gemäß Planregel ersetzt.`);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
